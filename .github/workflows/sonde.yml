name: Sonde webcams (ponctuelle)
on:
  push:
    paths: ["outils/sonde_webcams.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python outils/sonde_webcams.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add sonde
          git commit -m "Résultat sonde webcams" || echo rien
          git push
